[preprocessing]
preprocess = true  # Perform preprocessing if true

# Operations are run in order
operations = [
  { name = "OrdinalEncoder", feature_list = ["SEX", "CATEGORY_LEVEL_1"] },
  { name = "StandardScaler", feature_list = ["CATEGORY_LEVEL_1"], with_mean = true },
]

[validation]
[validation.test_split]  # Test / train splitting variables
strategy = "group"  # Can be random, group or none
group_column = "OP_YEAR"  # Group to use to extract test set
values = [2024]  # Values of group to extract the test set
test_size = 0.1  # Size of the test set if not using group
drop_group_column = true  # Flag for dropping group column

[validation.recalibration_split]  # Recalibration data splitting variables
strategy = "none"  # Can be random, group, or none
group_column = "OP_YEAR"  # Group to use to extract test set
values = [2023]  # Values of group to extract the calibration set
recalibration_size = 0.1  # Size of the test set if not using group
drop_group_column = true  # Flag for dropping group column

[validation.cross_validation]  # Cross-validation variables
strategy = "none"  # Can be random, group, or none
group_column = "DHB_NAME"
n_splits = 20  # Number of groups (group strategy) or folds (random strategy)
shuffle = true
random_state = 42
drop_group_column = true  # Flag for dropping group column
