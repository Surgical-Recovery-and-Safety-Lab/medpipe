[meta]
version = "v0.1.1"  # Used to get data, workflow, and hyperparameters
project_name = "ai_risk_HGBc"
# Options
# audit: CV training, CV probability caching, evaluation metrics,
# calibration and fairness, final model training
# cv: CV training, CV probability caching, evaluation metrics, final model training
# eval: Run final model training, evaluation metrics, calibration and fairness.
# fast: Only run final model training
run_mode = "cv"

[paths]
# Paths can be relative or absolute
config_dir = "config-examples/HGBc/"  # Path from medpipe root
model_dir = "~/models/"  # Save model directory
figure_dir = "figures/"  # Directory to save figures

[model]
algorithm = "HistGradientBoostingClassifier"

[recalibration]
method = "IsotonicRegression"
