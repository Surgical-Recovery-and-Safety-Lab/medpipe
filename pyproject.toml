[project]
name = "medpipe"
description = "Clinical AI pipeline developement following TRIPOD+AI guidelines"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Mathias Roesler", email = "mathias.roesler@auckland.co.nz" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["version"]

# Core runtime dependencies
dependencies = [
  "matplotlib>=3.10.0",
  "ngboost>=0.5.10",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.0.0",
  "scikit-learn>=1.8.0",
  "scipy>=1.12.0",
  "splinecalib>=0.0.13",
]

[project.urls]
Changelog = "https://github.com/Surgical-Recovery-and-Safety-Lab/medpipe/blob/main/CHANGELOG.md"
Homepage = "https://github.com/Surgical-Recovery-and-Safety-Lab/medpipe"
Repository = "https://github.com/Surgical-Recovery-and-Safety-Lab/medpipe.git"

# Development and testing dependencies
[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra -q"
minversion = "8.0"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "medpipe.__version__" }
