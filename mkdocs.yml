site_name: Medpipe
repo_url: https://github.com/Surgical-Recovery-and-Safety-Lab/medpipe
repo_name: Surgical-Recovery-and-Safety-Lab/medpipe
theme:
  name: material
  palette:
    scheme: slate # Dark mode; remove this line for light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest

validation:
  anchors: warn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - include-markdown
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_root_toc_entry: false
            heading_level: 2
            members_order: source
            inherited_members: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters:
              - "!^_"
            inventories:
              - https://docs.python.org/3/objects.inv
              - https://numpy.org/doc/stable/objects.inv
              - https://pandas.pydata.org/docs/objects.inv
              - https://scikit-learn.org/stable/objects.inv


nav:
  - Home: index.md
  - Getting started:
    - Installation: start/install.md
    - Quickstart example: start/quickstart.md
  - Examples: examples.md
  - Configuration guide:
    - Overview: guide/config/index.md
    - Meta: guide/config/meta.md
    - Data: guide/config/data.md
    - Default model: guide/config/default_model.md
    - Outcome overrides: guide/config/outcome_overrides.md
    - Workflow: guide/config/workflow.md
    - Display: guide/config/display.md
    - Regression: guide/config/regression.md
  - Guides:
    - The run folder: guide/run_folder.md
    - Confidence intervals: guide/confidence_intervals.md
    - TRIPOD+AI reporting: guide/tripod_ai.md
  - API reference:
    - Overview: api/index.md
    - Configuration: api/config.md
    - Data: api/data.md
    - Metrics: api/metrics.md
    - Models: api/models.md
    - Pipeline: api/pipeline.md
    - Utils: api/utils.md
    - Visualisation: api/visualisation.md
